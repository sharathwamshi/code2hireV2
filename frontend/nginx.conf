server {
  listen 80;
  client_max_body_size 50m;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://backend:5050; proxy_set_header Host $host; proxy_read_timeout 120s; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_request_buffering off; }
  location / { try_files $uri /index.html; }
}
