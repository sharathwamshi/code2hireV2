# Alembic config for Code2Hire.  Usage (from backend/):
#   alembic stamp 0001_baseline     # once, on a database created by the first release
#   alembic upgrade head            # apply 0002, 0003
#   alembic downgrade -1            # roll back the last one
# The database URL comes from DATABASE_URL (same as the app).
[alembic]
script_location = migrations/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
